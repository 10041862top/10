site_name: book-to-skill
site_description: >-
  將任何書籍、PDF 或 EPUB 轉換為 Claude Code、GitHub Copilot CLI 與 Amp 專用的結構化 agent skill — 按需載入框架與決策規則。
site_url: https://booktoskill.is-a.dev/
repo_url: https://github.com/virgiliojr94/book-to-skill
repo_name: virgiliojr94/book-to-skill
edit_uri: ""

# index.md is a committed landing page. Guide (README.md) and Skill Reference
# (SKILL.md) are assembled from the repo root at build time, so prose docs stay
# single-source. See .github/workflows/deploy-docs.yml.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切換至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切換至淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

nav:
  - 首頁 (Home): index.md
  - 指南 (Guide): guide.md
  - 運作原理 (How it works): how-it-works.md
  - 使用方式 (Usage): usage.md
  - 安裝 (Install): install.md
  - 常見問題 (FAQ): faq.md
  - 系統架構 (Architecture): architecture.md
  - 效能 (Performance): performance.md
  - 技能參考 (Skill Reference): skill-reference.md

plugins:
  # `search` is on by default, but naming any plugin replaces the default list.
  - search
  # No `social` plugin: the share card is a hand-made docs/assets/og-card.jpg and
  # overrides/main.html emits the og:/twitter: tags around it.
  #
  # The docs pages were renamed to lowercase kebab-case slugs; keep the old
  # SHOUTING_CASE URLs alive so existing inbound links and bookmarks resolve.
  - redirects:
      redirect_maps:
        HOW_IT_WORKS.md: how-it-works.md
        USAGE.md: usage.md
        INSTALL.md: install.md
        FAQ.md: faq.md
        ARCHITECTURE.md: architecture.md
        PERFORMANCE.md: performance.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
